services:
  academic-service:
    build: .
    env_file: .env
    ports:
      - "${ACADEMIC_SERVICE_APP_PORT}:80"
    depends_on:
      - academic-service-db
    networks:
      - academic-service-net
      - backend-net

  academic-service-db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${ACADEMIC_SERVICE_DATABASE_USER}
      POSTGRES_PASSWORD: ${ACADEMIC_SERVICE_DATABASE_PASSWORD}
      POSTGRES_DB: ${ACADEMIC_SERVICE_DATABASE_DB}
    ports:
      - "${ACADEMIC_SERVICE_DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./academic-database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - academic-service-net

volumes:
  postgres-data:

networks:
  academic-service-net:
  backend-net:
    external: true